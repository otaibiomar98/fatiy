<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E3A3B">
<title>مستقبل فتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Reem+Kufi:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout: a printed-poster look from فتي's own committee sheet. Paper ground, deep-teal ink, four committee bands (teal, mustard, rust, plum). Sticky header with a scrolling tab strip, then one section per tab. */
:root{
  --paper:#F5EEDF; --card:#FFFAF0; --card-2:#EFE5CF; --ink:#0E3A3B; --muted:#5D6A66; --line:#E0D3B8;
  --teal:#1F6E78; --mustard:#A97C12; --rust:#C24F28; --plum:#5A3F78; --gold:#B8860B; --gold-soft:#F3E3B5;
  --band-teal:#1F6E78; --band-mustard:#A97C12; --band-rust:#C24F28; --band-plum:#5A3F78; --on-band:#FFF8EA;
  --c-move:#D9563A; --c-early:#2F8F66; --c-init:#6E4FC4; --c-task:#1F72B8; --c-cult:#B8457A;
  --ok:#2F8F66; --danger:#B33A3A;
  --shadow:0 1px 2px rgba(14,58,59,.06),0 8px 22px rgba(14,58,59,.08);
  --f-wordmark:"Lalezar","Reem Kufi",system-ui,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1C1D; --card:#152828; --card-2:#1D3333; --ink:#F1E8D6; --muted:#A5B1AC; --line:#2A4141;
  --teal:#4FB0BA; --mustard:#DDAE45; --rust:#EE7C55; --plum:#A88AD6; --gold:#E2B33C; --gold-soft:#3A2F16;
  --band-teal:#1A5A62; --band-mustard:#7E5D0E; --band-rust:#9A3F21; --band-plum:#48325F; --on-band:#FFF6E4;
  --c-move:#F07457; --c-early:#4CC18D; --c-init:#A07BF0; --c-task:#5AA6EE; --c-cult:#E26CA3;
  --ok:#4CC18D; --danger:#E26464; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1C1D; --card:#152828; --card-2:#1D3333; --ink:#F1E8D6; --muted:#A5B1AC; --line:#2A4141;
  --teal:#4FB0BA; --mustard:#DDAE45; --rust:#EE7C55; --plum:#A88AD6; --gold:#E2B33C; --gold-soft:#3A2F16;
  --band-teal:#1A5A62; --band-mustard:#7E5D0E; --band-rust:#9A3F21; --band-plum:#48325F; --on-band:#FFF6E4;
  --c-move:#F07457; --c-early:#4CC18D; --c-init:#A07BF0; --c-task:#5AA6EE; --c-cult:#E26CA3;
  --ok:#4CC18D; --danger:#E26464; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
img{max-width:100%}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.wordmark{font-family:var(--f-wordmark);font-size:2rem;line-height:1;color:var(--gold)}
.brand span{font:700 1rem var(--f-display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px 10px;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font:600 .92rem var(--f-body);padding:7px 14px;border-radius:999px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs a:hover:not([aria-current]){background:var(--card-2);color:var(--ink)}

main{padding-block:22px 120px}
section.view{display:flex;flex-direction:column;gap:28px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.5rem}
.sec-h p{color:var(--muted);font-size:.92rem}
.eyebrow{font:600 .78rem var(--f-body);letter-spacing:.02em;color:var(--gold)}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem}
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1.5px dashed var(--line);border-radius:16px;background:transparent;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card-2);color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--ink);color:var(--paper);font:600 .9rem var(--f-body);white-space:nowrap}
.btn.gold{background:var(--gold);color:#1B1405}
.btn.ghost{background:var(--card-2);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:.8rem;border-radius:9px}
.btn.del{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;width:100%;min-width:0;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row > *{flex:1 1 160px}
.row > .btn{flex:0 0 auto}
.editonly{display:none}
body.editing .editonly{display:revert}
body.editing .viewonly{display:none}

/* Avatar */
.av{position:relative;border-radius:50%;overflow:hidden;background:var(--card-2);display:grid;place-items:center;flex:0 0 auto;font-family:var(--f-display);font-weight:700;color:var(--teal)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* HOME */
.hero{position:relative;border-radius:26px;overflow:hidden;background:var(--band-teal);color:var(--on-band);min-height:min(520px,62vw);display:grid}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
.hero .collage{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);opacity:.5}
.hero .collage div{background-size:cover;background-position:center;min-height:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,24,25,.92) 8%,rgba(6,24,25,.35) 60%,rgba(6,24,25,.15))}
.hero .txt{position:relative;align-self:end;padding:26px 24px 24px;display:flex;flex-direction:column;gap:6px}
.hero h1{font-family:var(--f-wordmark);font-weight:400;font-size:clamp(2.6rem,8vw,4.6rem);line-height:1.05;letter-spacing:0}
.hero h1 em{font-style:normal;color:#F2C14E}
.hero .sub{font:700 clamp(1.1rem,3.2vw,1.5rem) var(--f-display);color:#FFE9B8}
.hero .motto{max-width:60ch;opacity:.92}
.hero .upl{position:absolute;top:14px;left:14px}

.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.champ{border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;color:var(--on-band);position:relative;overflow:hidden}
.champ.points{background:var(--band-mustard)}
.champ.khw{background:var(--band-plum)}
.champ .av{width:84px;height:84px;font-size:1.8rem;box-shadow:0 0 0 3px #F2C14E;color:var(--band-teal)}
.champ .lbl{font:600 .82rem var(--f-body);opacity:.85}
.champ .nm{font:700 1.3rem var(--f-display)}
.champ .val{font:700 1rem var(--f-body);color:#FFE9B8}
.champ .medal{position:absolute;left:14px;top:12px;width:40px;height:40px;opacity:.9}

.daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dcard{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--k)}
.dcard .k{font:600 .8rem var(--f-body);color:var(--k)}
.dcard h3{font-size:1.1rem}
.dcard p{color:var(--muted);font-size:.9rem}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sup{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sup .av{width:96px;height:96px;font-size:2rem;box-shadow:0 0 0 3px var(--gold)}
.sup b{font:700 1.02rem var(--f-display)}
.sup small{color:var(--muted)}
.mstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 10px}
.mstrip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mstrip .av{width:68px;height:68px;font-size:1.4rem}
.mstrip figcaption{font-size:.8rem;font-weight:600;line-height:1.3}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.shot{margin:0;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--card-2)}
.shot figcaption{padding:8px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:6px}
.shot.ph{aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);border:1.5px dashed var(--line);background:transparent;box-shadow:none;font-size:.85rem;text-align:center;padding:12px}

.ygoals{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;counter-reset:g}
.yg{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;position:relative}
.yg b{font:700 1.05rem var(--f-display)}
.yg p{color:var(--muted);font-size:.9rem}

.progs{display:flex;flex-wrap:wrap;gap:8px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;flex:1 1 200px}
.prog b{font:700 1rem var(--f-display);color:var(--teal)}
.prog small{color:var(--muted)}
.news{display:flex;flex-direction:column;gap:8px}
.news li{list-style:none;background:var(--card);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:baseline;box-shadow:var(--shadow)}
.news ul{padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.news time{font-size:.78rem;color:var(--gold);font-weight:700;white-space:nowrap}

/* POINTS */
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:.9rem}
.summary b{color:var(--ink);font-family:var(--f-display);font-size:1.25rem}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 10px 3px 8px;border-radius:999px}
.legend svg{width:18px;height:18px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.pcard .rank{position:absolute;top:10px;right:12px;font:700 .85rem var(--f-display);color:var(--muted)}
.pcard.t1 .rank,.pcard.t2 .rank,.pcard.t3 .rank{color:var(--gold)}
.ringav{position:relative;width:104px;height:104px}
.ringav .av{width:100%;height:100%;font-size:2rem;border:3px solid var(--card)}
.ringav svg.ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--card-2)}
.ring .fg{stroke:var(--gold);stroke-linecap:round}
.gift{position:absolute;bottom:-4px;left:-6px;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.gift svg{width:28px;height:28px}
.gift.due{animation:pulse 1.8s ease-in-out infinite}
.gift.done{opacity:.4;filter:grayscale(1)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.pcard .nm{font-weight:700;text-align:center;line-height:1.35}
.pts{font:700 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.pts small{font:500 .78rem var(--f-body);color:var(--muted);margin-inline-start:4px}
.status{font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--card-2);color:var(--muted)}
.status.due{background:var(--gold-soft);color:var(--ink)}
.bars{display:flex;width:100%;height:6px;border-radius:6px;overflow:hidden;background:var(--card-2)}
.bars i{display:block;height:100%}
.badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:28px}
.badges svg{width:28px;height:28px}
.mrow{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.mhead{display:flex;flex-direction:column;align-items:center;gap:6px;width:90px}
.mhead .av{width:70px;height:70px;font-size:1.4rem}
.mbody{min-width:0;display:flex;flex-direction:column;gap:10px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:6px 8px;border-inline-start:4px solid var(--cc)}
.cat .lbl{flex:1;min-width:0;font-size:.84rem;font-weight:600;line-height:1.3}
.cat .val{font:700 1.05rem var(--f-display);min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.step{display:flex;gap:4px}
.step button{border:0;border-radius:8px;font:700 .8rem var(--f-body);padding:5px 8px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.step button.plus{background:var(--cc);color:#fff;box-shadow:none}
.mlist{display:flex;flex-direction:column;gap:12px}

/* KHAWATER */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .av{width:76px;height:76px;font-size:1.6rem;box-shadow:0 0 0 3px var(--c)}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;background:var(--c);color:var(--on-band);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px}
.pod .blk b{font:700 1.4rem var(--f-display)}
.pod .nm{font-weight:700;font-size:.9rem;line-height:1.3}
.pod.p1{--c:var(--band-mustard)} .pod.p1 .blk{min-height:120px}
.pod.p2{--c:var(--band-teal)} .pod.p2 .blk{min-height:90px}
.pod.p3{--c:var(--band-rust)} .pod.p3 .blk{min-height:66px}
.ktable{width:100%;border-collapse:collapse;font-size:.9rem}
.ktable th,.ktable td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
.ktable th{font-size:.78rem;color:var(--muted);font-weight:600}
.ktable .who{display:flex;align-items:center;gap:10px;font-weight:700}
.ktable .who .av{width:38px;height:38px;font-size:.9rem}
.meter{height:8px;border-radius:8px;background:var(--card-2);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--plum);border-radius:8px}
.scroll-x{overflow-x:auto}
.kform .crit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.kform .crit span{font-size:.88rem;font-weight:600}
.kform .crit small{color:var(--muted);font-weight:400}
.seg{display:flex;gap:3px;direction:ltr}
.seg button{border:0;border-radius:8px;padding:5px 8px;font:600 .78rem var(--f-body);background:var(--card-2);color:var(--ink);cursor:pointer;min-width:40px}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
.klist{display:flex;flex-direction:column;gap:6px}
.kitem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border-radius:12px;padding:8px 12px;font-size:.88rem;flex-wrap:wrap}

/* GOALS */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.gtop{display:flex;align-items:center;gap:12px}
.gtop .av{width:56px;height:56px;font-size:1.2rem}
.gtop b{font:700 1.05rem var(--f-display);display:block}
.donut{width:58px;height:58px;margin-inline-start:auto;position:relative;flex:0 0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:6}
.donut .bgc{stroke:var(--card-2)} .donut .fg{stroke:var(--teal);stroke-linecap:round}
.donut span{position:absolute;inset:0;display:grid;place-items:center;font:700 .85rem var(--f-display)}
.glist{display:flex;flex-direction:column;gap:8px}
.gl{display:flex;flex-direction:column;gap:4px}
.gl .t{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;font-weight:600}
.gl .t span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.gbar{height:8px;border-radius:8px;background:var(--card-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:8px;background:var(--teal)}
.gbar i.full{background:var(--ok)}
.gseg{display:flex;gap:3px;flex-wrap:wrap}
.gseg button{border:0;border-radius:7px;padding:3px 7px;font:600 .74rem var(--f-body);background:var(--card-2);color:var(--ink);cursor:pointer}
.gseg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.gdefs{display:flex;flex-direction:column;gap:8px}
.gdef{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}

/* COMMITTEES */
.compare{display:flex;flex-direction:column;gap:10px}
.cmpr{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:.9rem;font-weight:600}
.cmpr .track{height:14px;border-radius:8px;background:var(--card-2);overflow:hidden}
.cmpr .track i{display:block;height:100%;border-radius:8px}
.cmpr b{font-family:var(--f-display);text-align:end;font-variant-numeric:tabular-nums}
.comm{border-radius:24px;background:var(--b);color:var(--on-band);padding:20px;display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:start}
.comm .ico{width:118px;height:118px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--b),0 0 0 6px var(--on-band);display:grid;place-items:center;font-size:3.2rem}
.comm h3{font-family:var(--f-wordmark);font-weight:400;font-size:2rem;line-height:1.15}
.comm .desc{opacity:.95}
.comm .cbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid color-mix(in srgb,var(--on-band) 70%,transparent);border-radius:999px;padding:3px 12px 3px 4px;font-weight:600;font-size:.9rem}
.pill .av{width:30px;height:30px;font-size:.8rem}
.pill.new{background:color-mix(in srgb,var(--on-band) 18%,transparent)}
.pill button{border:0;background:transparent;color:var(--on-band);cursor:pointer;font-size:1rem;line-height:1;padding:0 2px}
.cbox{background:color-mix(in srgb,#000 16%,transparent);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cbox h4{margin:0;font:700 .95rem var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:center}
.cbox .pct{font:700 1.1rem var(--f-display);font-variant-numeric:tabular-nums}
.cbar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--on-band) 22%,transparent);overflow:hidden}
.cbar i{display:block;height:100%;background:#F2C14E;border-radius:8px}
.tasks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.tasks li.done span{text-decoration:line-through;opacity:.75}
.tick{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--on-band);background:transparent;color:var(--on-band);display:grid;place-items:center;font-size:.8rem;padding:0;cursor:default}
body.editing .tick{cursor:pointer}
.tasks li.done .tick{background:#F2C14E;border-color:#F2C14E;color:#1B1405}
.tasks li span{flex:1;min-width:0}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.win{background:color-mix(in srgb,var(--on-band) 12%,transparent);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.win img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.win div{padding:8px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:4px}
.win time{font-size:.72rem;opacity:.8}
.win.ph{border:1.5px dashed color-mix(in srgb,var(--on-band) 55%,transparent);background:transparent;min-height:110px;display:grid;place-items:center;text-align:center;padding:10px;font-size:.82rem;opacity:.85}
.comm input,.comm textarea,.comm select{background:color-mix(in srgb,#000 18%,var(--paper));color:var(--ink)}
.comm .btn.ghost{background:color-mix(in srgb,var(--on-band) 18%,transparent);color:var(--on-band)}

/* LIBRARY */
.lib-feature{border-radius:22px;background:var(--band-plum);color:var(--on-band);padding:20px;display:flex;flex-direction:column;gap:8px}
.lib-feature h3{font-family:var(--f-wordmark);font-weight:400;font-size:1.8rem}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.book{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;min-width:0}
.spine{width:54px;height:76px;border-radius:4px 8px 8px 4px;background:var(--sc);color:#fff;display:grid;place-items:center;font:700 1.4rem var(--f-wordmark);box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.spine.pod{border-radius:50%;height:54px;box-shadow:none}
.book b{font:700 1rem var(--f-display);display:block;line-height:1.35}
.book .by{font-size:.82rem;color:var(--muted)}
.book p{font-size:.86rem;margin-top:4px}
.book .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:600 .84rem var(--f-body);cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* VISION (نقطة تحوّل) */
.vhero{border-radius:26px;background:var(--ink);color:var(--paper);padding:30px 24px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.vhero h2{font-family:var(--f-wordmark);font-weight:400;font-size:clamp(2.4rem,7vw,3.8rem);line-height:1.05;color:#F2C14E}
.vhero .ayah{font:600 1.15rem var(--f-display);opacity:.95}
.vhero small{opacity:.7}
.halves{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.half{border-radius:18px;padding:16px;background:var(--b);color:var(--on-band);display:flex;flex-direction:column;gap:4px}
.half .n{font:400 2.4rem/1 var(--f-wordmark);opacity:.9}
.half b{font:700 1.15rem var(--f-display)}
.half p{font-size:.88rem;opacity:.92}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.skill{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.skill b{font:700 1rem var(--f-display);color:var(--teal);display:block}
.skill p{font-size:.86rem;color:var(--muted)}
.equation{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font:700 1.2rem var(--f-display)}
.equation span{background:var(--card);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow)}
.equation i{font-style:normal;color:var(--gold)}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;counter-reset:t;padding:0;margin:0;list-style:none}
.tips li{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.9rem;box-shadow:var(--shadow)}

.score{width:100%;border-collapse:collapse;font-size:.9rem}

.score th{font-size:.78rem;color:var(--muted)}
.score td:last-child{font:700 1rem var(--f-display);color:var(--gold);white-space:nowrap}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cycle div{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
.cycle b{font:700 1.2rem var(--f-display);color:var(--rust);display:block}
.cycle p{font-size:.84rem;color:var(--muted)}
.oath{border-radius:22px;background:var(--band-mustard);color:var(--on-band);padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.oath h3{font-family:var(--f-wordmark);font-weight:400;font-size:2rem}
.oath .pills{justify-content:center}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ideas .panel h3{font-size:1.1rem;margin-bottom:8px}
.ideas ul{margin:0;padding:0 1.1em 0 0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}

/* Footer + edit bar */
footer.foot{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.85rem}
footer.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer .slogan{font:400 1.4rem var(--f-wordmark);color:var(--gold)}
.editbar{position:fixed;inset:auto 0 0;z-index:9;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.editbar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.editbar .btn.ghost{background:color-mix(in srgb,var(--paper) 16%,transparent);color:var(--paper)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#1B1405;padding:8px 18px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;z-index:30;background:rgba(6,24,25,.55);display:grid;place-items:center;padding:16px}
.modal form{width:min(440px,100%);display:flex;flex-direction:column;gap:10px}
input[type=password]{font:inherit;width:100%;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.ufile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@media (max-width:560px){

  .hero{min-height:300px}
  .gdef{grid-template-columns:1fr}
  .wordmark{font-size:1.7rem}
}

const BADGE_DEFS = [

  {id:"all", t:"متعدد المواهب", d:"٣ نقاط أو أكثر في كل الفقرات"},{id:"move", t:"بطل الحركة", d:"١٠ نقاط في الفقرة الحركية"},
  {id:"early", t:"السبّاق", d:"١٠ نقاط في الحضور المبكر"},{id:"init", t:"صاحب المبادرة", d:"١٠ نقاط في المبادرة"},
  {id:"task", t:"المُنجِز", d:"١٠ نقاط في تطبيق التكليف"},{id:"cult", t:"المثقف", d:"١٠ نقاط في المشاركة الثقافية"},
];
function badgesOf(m, max){
  const c = catsOf(m), out = [];
  if (max>0 && total(m)===max) out.push("crown");
  if (total(m)>=GOAL) out.push("star");
  if (CATS.every(k=>(Number(c[k.k])||0)>=3)) out.push("all");
  CATS.forEach(k=>{ if((Number(c[k.k])||0)>=10) out.push(k.k); });
  return out;
}
function ring(pct){ const r=48, C=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 104 104" aria-hidden="true"><circle class="bgc" cx="52" cy="52" r="${r}"/><circle class="fg" cx="52" cy="52" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,pct))}"/></svg>`; }

/* ---------- Khawater logic ---------- */
const kScore = k => (k.scores||[]).reduce((s,v)=>s+(Number(v)||0),0);
function kRanking(){
  const by = {};
  (S.khawater||[]).forEach(k=>{ if(!S.members[k.m]) return; (by[k.m] ||= []).push(kScore(k)); });
  return Object.entries(by).map(([id,arr])=>({m:mById(id), n:arr.length, avg:arr.reduce((a,b)=>a+b,0)/arr.length, best:Math.max(...arr)}))
    .sort((a,b)=>b.avg-a.avg || b.n-a.n || b.best-a.best);
}

/* ---------- Goals logic ---------- */
const prog = (mid,gid) => Number(((S.progress||{})[mid]||{})[gid])||0;
const mGoalPct = mid => (S.goals||[]).length ? (S.goals.reduce((s,g)=>s+prog(mid,g.id),0)/S.goals.length) : 0;

/* ---------- Committees logic ---------- */
const cPct = c => (c.tasks||[]).length ? Math.round(100*c.tasks.filter(t=>t.done).length/c.tasks.length) : 0;

  $("#tabs").innerHTML = ROUTES.map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${l}</a>`).join("");

}

  document.body.classList.toggle("editing", editing);

const addBtn = (act, label, extra="") => editing ? `<button class="btn sm ghost" type="button" data-act="${act}" ${extra}>＋ ${label}</button>` : "";

/* ----- POINTS ----- */
function vPoints(){
  const rk = ranked(), max = rk.length ? total(rk[0]) : 0;
  const sum = rk.reduce((s,m)=>s+total(m),0), due = rk.filter(m=>giftState(m)==="due").length;
  let rank = 0, prev = null;
  const cards = rk.map((m,i)=>{ const t = total(m); if (t!==prev){ rank=i+1; prev=t; }
    const gs = giftState(m), into = t % GOAL;
    const pct = gs==="none" ? t/GOAL : (into/GOAL);
    return `<div class="pcard ${rank<=3&&t>0?"t"+rank:""}">
      <span class="rank num">#${AR(rank)}</span>
      <div class="ringav">${ring(gs==="none"?pct:(into===0?1:pct))}${av(m)}${gs!=="none"?`<div class="gift ${gs}" title="${gs==="due"?"يستحق هدية":"استلم هديته"}">${ICON.gift}</div>`:""}</div>
      <div class="nm">${esc(m.name)}</div>
      <div class="pts num">${AR(t)}<small>نقطة</small></div>
      <span class="status ${gs==="due"?"due":""}">${gs==="due"?"يستحق هدية 🎁":`باقي ${AR(GOAL - into)} للهدية`}</span>
      <div class="bars" aria-hidden="true">${CATS.map(c=>{const v=Number(catsOf(m)[c.k])||0;return v?`<i style="width:${100*v/Math.max(1,t)}%;background:var(${c.c})" title="${c.label}: ${AR(v)}"></i>`:""}).join("")}</div>
      <div class="badges">${badgesOf(m,max).map(b=>{const d=BADGE_DEFS.find(x=>x.id===b);return `<span title="${d.t} — ${d.d}" role="img" aria-label="${d.t}">${ICON[b]}</span>`}).join("")}</div>
    </div>`; }).join("");
  const manage = editing ? `
    <div class="panel"><h3 style="margin-bottom:10px">إضافة مشترك</h3><div class="row"><input type="text" id="newMember" placeholder="اسم المشترك"><button class="btn" type="button" data-act="addMember">إضافة</button></div></div>

        <div class="mtop"><input type="text" data-bind="members.${m.id}.name" value="${esc(m.name)}" id="f-name-${m.id}" style="max-width:240px"><span class="pts num" style="font-size:1.4rem">${AR(total(m))}<small>نقطة</small></span></div>

        <div class="row" style="align-items:center">${giftsEarned(m)?`<span class="note">الهدايا: استحق ${AR(giftsEarned(m))} واستلم ${AR(giftsGiven(m))}</span><button class="btn sm gold" type="button" data-act="gift" data-m="${m.id}" ${giftState(m)!=="due"?"disabled":""}>تم تسليم هدية</button>`:`<span class="note">لم يصل إلى ٤٠ نقطة بعد</span>`}<button class="btn sm del" type="button" data-act="delMember" data-m="${m.id}">حذف المشترك</button></div>

    ${none.map(m=>`<tr><td>—</td><td><span class="who">${av(m)}${esc(m.name)}</span></td><td colspan="4" class="muted">لم يُلقِ خاطرة بعد</td></tr>`).join("")}
  </tbody></table></div>`:""}

/* ----- GOALS ----- */
function vGoals(){
  const gs = S.goals||[];
  const defs = editing ? `<div class="panel"><h3 style="margin-bottom:10px">الأهداف</h3><div class="gdefs">${gs.map((g,i)=>`<div class="gdef"><input type="text" data-bind="goals.${i}.t" value="${esc(g.t)}" id="f-g-${g.id}" placeholder="الهدف"><input type="text" data-bind="goals.${i}.d" value="${esc(g.d||"")}" id="f-gd-${g.id}" placeholder="كيف نقيسه؟">${delBtn("goals",i)}</div>`).join("")}</div>
    <div class="row" style="margin-top:10px"><input type="text" id="newGoal" placeholder="هدف جديد، مثال: حفظ جزء عمّ"><input type="text" id="newGoalD" placeholder="كيف نقيسه؟"><button class="btn" type="button" data-act="addGoal">إضافة الهدف</button></div></div>` : "";
  const avg = members().length ? members().reduce((s,m)=>s+mGoalPct(m.id),0)/members().length : 0;
  const cards = members().slice().sort((a,b)=>mGoalPct(b.id)-mGoalPct(a.id)).map(m=>{ const p = Math.round(mGoalPct(m.id)); const r=25, C=2*Math.PI*r;
    return `<div class="gcard"><div class="gtop">${av(m)}<div><b>${esc(m.name)}</b><span class="note">${AR(gs.filter(g=>prog(m.id,g.id)>=100).length)} من ${AR(gs.length)} أهداف مكتملة</span></div>
      <div class="donut"><svg viewBox="0 0 58 58"><circle class="bgc" cx="29" cy="29" r="${r}"/><circle class="fg" cx="29" cy="29" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><span class="num">${AR(p)}٪</span></div></div>
      <div class="glist">${gs.map(g=>{const v=prog(m.id,g.id);return `<div class="gl"><div class="t"><span>${esc(g.t)}</span><span>${AR(v)}٪</span></div><div class="gbar"><i class="${v>=100?"full":""}" style="width:${v}%"></i></div>${editing?`<div class="gseg">${[0,25,50,75,100].map(x=>`<button type="button" data-act="prog" data-m="${m.id}" data-g="${g.id}" data-v="${x}" aria-pressed="${v===x}">${AR(x)}٪</button>`).join("")}</div>`:""}</div>`}).join("")}</div></div>`; }).join("");
  return `${secH("أهداف المشتركين","كل شاب يرى مدى إنجازه في الأهداف المحددة · متوسط المجموعة " + AR(Math.round(avg)) + "٪")}

  ${gs.length?`<div class="ggrid">${cards}</div>`:`<div class="empty">لا توجد أهداف بعد. يضيفها المشرف من وضع المشرف.</div>`}`;
}

  const blocks = cs.map((c,ci)=>{ const pct=cPct(c); const others = members().filter(m=>!(c.members||[]).includes(m.id));
    return `<article class="comm" style="--b:var(${COLORS[c.color]||"--band-teal"})">
      <div class="ico" aria-hidden="true">${esc(c.icon)}</div>
      <div class="cbody">
        <h3>${T(`committees.${ci}.name`)}</h3>
        <p class="desc">${T(`committees.${ci}.desc`,{area:true})}</p>
        <div class="pills">${(c.members||[]).map((id,i)=>{const m=mById(id); if(!m) return ""; return `<span class="pill ${ (c.newMembers||[]).includes(id)?"new":""}">${av(m)}${esc(m.name)}${editing?`<button type="button" data-act="del" data-path="committees.${ci}.members" data-i="${i}" aria-label="إزالة">×</button>`:""}</span>`}).join("")}
          ${editing&&others.length?`<select data-act-change="addCM" data-c="${ci}" id="f-cm-${ci}" style="width:auto"><option value="">＋ إضافة عضو</option>${others.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>`:""}</div>
        <div class="cbox"><h4><span>المهام</span><span class="pct num">${AR(pct)}٪</span></h4><div class="cbar"><i style="width:${pct}%"></i></div>
          <ul class="tasks">${(c.tasks||[]).map((t,ti)=>`<li class="${t.done?"done":""}"><button class="tick" type="button" ${editing?`data-act="task" data-c="${ci}" data-t="${ti}"`:"tabindex='-1'"} aria-label="${t.done?"منجزة":"غير منجزة"}">${t.done?"✓":""}</button><span>${editing?`<input type="text" data-bind="committees.${ci}.tasks.${ti}.t" value="${esc(t.t)}" id="f-t-${ci}-${ti}">`:esc(t.t)}</span>${delBtn(`committees.${ci}.tasks`,ti,"×")}</li>`).join("") || `<li class="note" style="color:inherit;opacity:.8">لا مهام بعد</li>`}</ul>
          ${editing?`<div class="row"><input type="text" id="nt-${ci}" placeholder="مهمة جديدة"><button class="btn sm ghost" type="button" data-act="addTask" data-c="${ci}">إضافة</button></div>`:""}</div>
        <div class="cbox"><h4><span>إنجازات اللجنة</span><span class="num" style="font-size:.85rem">${AR((c.wins||[]).length)}</span></h4>
          <div class="wins">${(c.wins||[]).map((w,wi)=>`<div class="win">${safeImg(w.img)?`<img src="${safeImg(w.img)}" alt="" loading="lazy">`:""}<div><time>${fmtDate(w.date)}</time>${T(`committees.${ci}.wins.${wi}.t`,{area:true})}${editing?`<div class="row">${upBtn(`committees.${ci}.wins.${wi}.img`,"📷")}${delBtn(`committees.${ci}.wins`,wi)}</div>`:""}</div></div>`).join("")}
            ${(c.wins||[]).length<2?Array.from({length:2-(c.wins||[]).length}).map(()=>`<div class="win ph">مكان لإنجاز قادم ✦</div>`).join(""):""}</div>

      </div></article>`; }).join("");
  return `${secH("تقسيمة اللجان","لكل مشكلة لجنة… ولكل لجنة إنجاز")}${cmp}${blocks}`;
}

document.addEventListener("input", e=>{

  if (b && editing){ setPath(b.dataset.bind, b.value); markDirty(); return; }
  const k = e.target.closest("[data-kd]");

});
document.addEventListener("change", e=>{
  const k = e.target.closest("[data-kd]"); if (k && kd){ kd[k.dataset.kd] = k.value; }
  const s = e.target.closest("[data-act-change='addCM']");
  if (s && s.value){ const c = S.committees[+s.dataset.c]; (c.members ||= []).push(s.value); markDirty(); render(); }
});
let uploadTarget = null;
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  const val = id => (document.getElementById(id)?.value||"").trim();
  switch(a){
    case "libf": libFilter = b.dataset.k; render(); return;
  }
  if (!editing) return;
  switch(a){
    case "del": { const arr = getPath(b.dataset.path); if (Array.isArray(arr)) arr.splice(+b.dataset.i,1); break; }
    case "clear": setPath(b.dataset.path, ""); break;
    case "upload": uploadTarget = b.dataset.target; $("#ufile").value=""; $("#ufile").click(); return;
    case "addSup": (S.supervisors ||= []).push({name:"",role:"مشرف",photo:""}); break;
    case "addShot": uploadTarget = "__gallery"; $("#ufile").value=""; $("#ufile").click(); return;
    case "addYG": S.site.yearGoals.push({t:"هدف جديد",d:""}); break;
    case "addNews": (S.site.news ||= []).unshift({date:today(),t:""}); break;
    case "addProg": S.site.programs.push({name:"برنامج",d:""}); break;
    case "pt": { const m=S.members[b.dataset.m]; m.cats ||= {}; m.cats[b.dataset.k] = Math.max(0,(Number(m.cats[b.dataset.k])||0)+Number(b.dataset.n)); break; }
    case "gift": { const m=S.members[b.dataset.m]; m.giftsGiven = (Number(m.giftsGiven)||0)+1; toast("سُجّل تسليم الهدية"); break; }
    case "addMember": { const n=val("newMember"); if(!n) return toast("اكتب اسم المشترك"); const ord=Math.max(0,...Object.values(S.members).map(m=>m.order||0))+1; S.members[uid("m")] = {name:n,order:ord,cats:{},giftsGiven:0,photo:""}; break; }
    case "delMember": { if (b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="اضغط مرة ثانية للتأكيد"; return; } const id=b.dataset.m; delete S.members[id]; S.committees.forEach(c=>c.members=(c.members||[]).filter(x=>x!==id)); break; }
    case "kscore": kd.scores[+b.dataset.i] = Number(b.dataset.v); render(); return;
    case "addK": { if(!kd.m) return toast("اختر المشترك"); (S.khawater ||= []).push({id:uid("k"), m:kd.m, title:kd.title.trim(), date:kd.date, scores:kd.scores.slice()}); toast("أُضيفت الخاطرة"); kd = newKd(); break; }
    case "addGoal": { const t=val("newGoal"); if(!t) return toast("اكتب الهدف"); (S.goals ||= []).push({id:uid("g"), t, d:val("newGoalD")}); break; }
    case "prog": { S.progress ||= {}; (S.progress[b.dataset.m] ||= {})[b.dataset.g] = Number(b.dataset.v); break; }
    case "task": { const t=S.committees[+b.dataset.c].tasks[+b.dataset.t]; t.done=!t.done; break; }
    case "addTask": { const t=val("nt-"+b.dataset.c); if(!t) return; (S.committees[+b.dataset.c].tasks ||= []).push({t,done:false}); break; }
    case "addWin": { const t=val("nw-"+b.dataset.c); if(!t) return; (S.committees[+b.dataset.c].wins ||= []).push({t,date:today(),img:""}); break; }
    case "addWork": { const t=val("newWork"); if(!t) return; (S.featured.works ||= []).push(t); break; }
    case "addLib": { const t=val("nl-t"); if(!t) return toast("اكتب العنوان"); S.library.push({cat:val("nl-cat")||"self", t, by:val("nl-by"), why:val("nl-why")}); break; }
    default: return;
  }
  markDirty(); render();
});
/* Image upload → resized JPEG data URI stored in the page */
$("#ufile").addEventListener("change", async e=>{
  const f = e.target.files && e.target.files[0]; if (!f || !uploadTarget) return;
  try{
    const isAvatar = /photo$/.test(uploadTarget);
    const url = await shrink(f, isAvatar ? 420 : 1100, isAvatar ? .8 : .72);
    if (uploadTarget==="__gallery") (S.gallery ||= []).push({url, cap:""});
    else setPath(uploadTarget, url);
    markDirty(); render(); toast("أُضيفت الصورة. احفظ لتظهر للجميع");
  }catch(_){ toast("تعذّرت قراءة الصورة. جرّب صورة JPG أو PNG"); }
});
function shrink(file, maxSide, q){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = ()=>{ const s = Math.min(1, maxSide/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}

$("#discardBtn").addEventListener("click", ()=>{ S = JSON.parse(ORIGINAL); dirty = false; editing = false; kd = null; updateBar(); render(); toast("أُلغيت التعديلات"); });
/* ---- Save to GitHub: images become files in images/, data goes to data.json ---- */
const b64 = bytes => { let s=""; const CH=0x8000; for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH)); return btoa(s); };
async function ghReq(path, opts={}){
  const r = await fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}`, {...opts, headers:{"Authorization":"Bearer "+gh.token, "Accept":"application/vnd.github+json", ...(opts.headers||{})}});
  if (r.status===404 && (!opts.method || opts.method==="GET")) return null;
  if (!r.ok){ const e = new Error("gh"); e.status = r.status; throw e; }
  return r.json();
}
async function ghPut(path, base64, message){
  const cur = await ghReq(path + "?t=" + Date.now());
  return ghReq(path, {method:"PUT", body: JSON.stringify({message, content: base64, ...(cur&&cur.sha?{sha:cur.sha}:{})})});
}
async function uploadPendingImages(){
  const jobs = [];
  (function walk(o){ if (!o || typeof o!=="object") return; for (const k of Object.keys(o)){ const v=o[k]; if (typeof v==="string" && v.startsWith("data:image/")) jobs.push([o,k,v]); else walk(v); } })(S);
  let n = 0;
  for (const [o,k,v] of jobs){
    n++; $("#saveBtn").textContent = `رفع الصور ${AR(n)}/${AR(jobs.length)}…`;
    const path = "images/" + uid("p") + ".jpg";
    await ghPut(path, v.split(",")[1], "صورة جديدة");
    o[k] = path;
  }
}
$("#saveBtn").addEventListener("click", async ()=>{
  if (!gh.token || !gh.repo){ openLogin(); return; }
  saving = true; updateBar(); $("#saveBtn").textContent = "جارٍ الحفظ…";
  try{
    await uploadPendingImages();
    S.savedAt = Date.now();
    const bytes = new TextEncoder().encode(JSON.stringify(S));
    $("#saveBtn").textContent = "حفظ البيانات…";
    await ghPut("data.json", b64(bytes), "تحديث المنصة " + new Date().toLocaleString("ar-EG"));
    dirty = false; render(); toast("حُفظ ✓ يظهر للجميع خلال دقيقة أو دقيقتين");
  }catch(err){
    const s = err && err.status;
    if (s===401||s===403) toast("مفتاح GitHub غير صالح أو بلا صلاحية كتابة. أعد الدخول");
    else if (s===404) toast("لم يُعثر على المستودع. تأكد من الاسم بصيغة user/repo");
    else if (s===409) toast("تعارض في الحفظ. حدّث الصفحة وأعد المحاولة");
    else toast("تعذّر الحفظ. تحقق من الاتصال وحاول مرة أخرى");
  }
  saving = false; $("#saveBtn").textContent = "حفظ ونشر"; updateBar();
});

/* ---- Admin login (GitHub token kept only on this device) ---- */
function openLogin(){ $("#login").hidden = false; $("#lg-repo").value = gh.repo || guessRepo(); $("#lg-token").value = ""; $("#lg-token").focus(); }
function guessRepo(){ const m = location.hostname.match(/^([\w-]+)\.github\.io$/); const seg = location.pathname.split("/").filter(Boolean)[0]; return m ? (m[1] + "/" + (seg || (m[1]+".github.io"))) : ""; }
$("#lg-cancel").addEventListener("click", ()=>{ $("#login").hidden = true; });
$("#lg-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const repo = $("#lg-repo").value.trim().replace(/^https:\/\/github\.com\//,"").replace(/\/$/,""), token = $("#lg-token").value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token){ $("#lg-err").textContent = "اكتب اسم المستودع بصيغة user/repo والمفتاح"; return; }
  $("#lg-err").textContent = "جارٍ التحقق…";
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}`, {headers:{"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"}});
    if (!r.ok) throw r.status;
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw 403;
    gh.repo = repo; gh.token = token;
    try{ localStorage.setItem(GH_KEY, JSON.stringify(gh)); }catch(_){}
    $("#login").hidden = true; editing = true; updateBar(); render(); toast("أهلاً بالمشرف ✎");
  }catch(s){ $("#lg-err").textContent = s===404 ? "المستودع غير موجود أو المفتاح لا يصل إليه" : "المفتاح غير صالح أو بلا صلاحية كتابة"; }
});
$("#logoutBtn").addEventListener("click", ()=>{ if (dirty){ toast("احفظ أو ألغِ التعديلات أولاً"); return; } try{ localStorage.removeItem(GH_KEY); }catch(_){} gh.token = gh.repo = undefined; editing = false; updateBar(); render(); toast("خرجت من وضع المشرف على هذا الجهاز"); });

window.addEventListener("hashchange", ()=>{ render(); window.scrollTo({top:0}); });
render();

/* Admin button: shown always (small); entering needs a GitHub key. ?admin in the link is not required. */
$("#editBtn").hidden = false;
}
</script>
